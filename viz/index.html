<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Wifi map - Flipper Zero Wardriving</title>
        <link rel="stylesheet" href="vendor/leaflet.css">
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header>
            <div class="logo">
                <span class="logo-icon">📡</span>
                <h1>Wardriving Viewer</h1>
            </div>
            <p class="tagline">Visualize wifi networks</p>
        </header>
        
        <div class="filters-bar">
            <form id="filters">
                <div class="filter-group">
                    <label for="ssid-filter">SSID Search</label>
                    <input type="text" id="ssid-filter" placeholder="Enter network name..." />
                </div>

                <div class="filter-group">
                    <label for="rssi-filter">Signal Strength (RSSI)</label>
                    <div class="range-wrapper">
                        <input type="range" id="rssi-filter" min="-100" max="-30" value="-100" />
                        <span id="rssi-value">-100 dBm</span>
                    </div>
                    <div class="range-labels">
                        <span>Weak</span>
                        <span>Strong</span>
                    </div>
                </div>
                
                <button type="button" id="apply-filters">Apply Filters</button>
            </form>
        </div>
        
        <main class="container">
            <section class="map-panel">
                <div id="map"></div>
            </section>
            
            <aside class="networks-panel">
                <h2>Detected Networks</h2>
                <div class="table-wrapper">
                    <table id="wifi-table">
                        <thead>
                            <tr>
                                <th>SSID</th>
                                <th>Security</th>
                                <th>RSSI</th>
                                <th>CH</th>
                                <th>MAC</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </aside>
        </main>

        <script src="vendor/leaflet.js"></script>
        <script src="script.js"></script>
    </body>
</html>
